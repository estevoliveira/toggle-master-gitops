apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: loki
          image: {{ .Values.lokiImage | quote }}
          args: [-config.file=/etc/loki/config.yaml]
          ports: [{name: http, containerPort: 3100}]
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 90
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          emptyDir: {sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: loki}
  ports: [{name: http, port: 3100, targetPort: http}]
