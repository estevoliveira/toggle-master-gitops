{{- range $name := list "gateway" "agent" "loki" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $.Release.Namespace }}
data:
  config.yaml: |
{{- $config := $.Files.Get (printf "config/%s.yaml" $name) | fromYaml }}
{{- if and (eq $name "gateway") (not $.Values.externalIntegrationsEnabled) }}
{{- $_ := unset $config.exporters "otlphttp/newrelic" }}
{{- $_ := set $config.exporters "debug" (dict "verbosity" "basic") }}
{{- $_ := set $config.service.pipelines.traces "exporters" (list "debug") }}
{{- end }}
{{ $config | toYaml | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: self-healer-code
  namespace: {{ .Release.Namespace }}
data:
  server.py: |
{{ .Files.Get "files/self_healer.py" | indent 4 }}
