apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-datasource
  namespace: {{ .Release.Namespace }}
  labels: {grafana_datasource: "1"}
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-fase4-alerts
  namespace: {{ .Release.Namespace }}
  labels: {grafana_alert: "1"}
data:
  fase4.yaml: |
{{ .Files.Get "config/alerts.yaml" | indent 4 }}
