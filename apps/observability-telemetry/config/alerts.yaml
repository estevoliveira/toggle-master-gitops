apiVersion: 1
groups:
- orgId: 1
  name: fase4
  folder: ToggleMaster
  interval: 30s
  rules:
  - uid: evaluation-errors
    title: EvaluationHighErrorRate
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 180
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum(rate(toggle_http_requests_total{service_name="evaluation-service",status_code=~"5.."}[2m]))
          / clamp_min(sum(rate(toggle_http_requests_total{service_name="evaluation-service"}[2m])),
          0.001)
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
        conditions:
        - evaluator:
            params: []
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            params:
            - 0.05
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
    noDataState: OK
    execErrState: Error
    for: 45s
    annotations:
      summary: Mais de 5% de erros HTTP 5xx no evaluation-service
      description: 'Janela de 2 minutos; pendencia de 45s evita reagir a falhas isoladas.
        Runbook: verificar dependencias e reiniciar evaluation uma vez.'
    labels:
      service: evaluation-service
      severity: critical
      team: togglemaster
    isPaused: false
contactPoints:
- orgId: 1
  name: fase4-healing
  receivers:
  - uid: fase4-webhook
    type: webhook
    disableResolveMessage: false
    settings:
      url: http://self-healer.observability.svc.cluster.local:8080/alert
      httpMethod: POST
      authorization_scheme: Bearer
      authorization_credentials: $HEAL_TOKEN
policies:
- orgId: 1
  receiver: fase4-healing
  group_by:
  - alertname
  - service
  group_wait: 0s
  group_interval: 30s
  repeat_interval: 10m
