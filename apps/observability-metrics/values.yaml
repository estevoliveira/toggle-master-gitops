# Descoberto pelo bootstrap a partir do Load Balancer do ingress-nginx.
publicHost: ""

monitoring:
  fullnameOverride: monitoring
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  windowsMonitoring:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  prometheusOperator:
    tls:
      enabled: false
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
  prometheus:
    service:
      type: ClusterIP
    prometheusSpec:
      replicas: 1
      retention: 24h
      scrapeInterval: 30s
      evaluationInterval: 30s
      enableOTLPReceiver: true
      storageSpec:
        emptyDir: {}
      resources:
        requests: {cpu: 150m, memory: 400Mi}
        limits: {cpu: "1", memory: 1Gi}
  kube-state-metrics:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
  prometheus-node-exporter:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
  grafana:
    enabled: true
    fullnameOverride: grafana
    defaultDashboardsEnabled: false
    testFramework:
      enabled: false
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: false
    persistence:
      enabled: false
    env:
      GF_SECURITY_COOKIE_SECURE: "true"
    envValueFrom:
      GF_SERVER_ROOT_URL:
        configMapKeyRef:
          name: grafana-public-url
          key: root-url
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 300m, memory: 512Mi}
    sidecar:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
      dashboards:
        enabled: true
        searchNamespace: observability
        resource: configmap
      datasources:
        enabled: true
        defaultDatasourceEnabled: true
        uid: prometheus
        searchNamespace: observability
        resource: configmap
        alertmanager:
          enabled: false
