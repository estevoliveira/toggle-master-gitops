{{- if .Values.appsEnabled }}
{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app: {{ $name }}}
  ports: [{port: {{ $svc.port }}, targetPort: http, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels: {app: {{ $name }}}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ printf "toggle-local/%s:%s" $name $svc.tag | quote }}
          imagePullPolicy: Never
          ports: [{name: http, containerPort: {{ $svc.port }}}]
          envFrom:
            - configMapRef: {name: fase4-telemetry, optional: true}
            - configMapRef: {name: local-aws}
          env:
            - {name: PORT, value: {{ $svc.port | quote }}}
            - {name: AUTH_SERVICE_URL, value: "http://auth-service:8001"}
            - {name: FLAG_SERVICE_URL, value: "http://flag-service:8002"}
            - {name: TARGETING_SERVICE_URL, value: "http://targeting-service:8003"}
            - {name: REDIS_URL, value: "redis://redis:6379"}
            - {name: MASTER_KEY, value: local-only-master-key}
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef: {name: academy-databases, key: service-api-key}
            {{- if $svc.database }}
            - {name: DATABASE_URL, value: {{ printf "postgres://lab:local-only-password@postgres:5432/%s?sslmode=disable" $svc.database | quote }}}
            {{- end }}
            {{- if eq $name "evaluation-service" }}
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef: {name: fase4-demo, key: demo-token}
            {{- end }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 40
          resources:
            requests: {cpu: 30m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
{{- end }}
{{- end }}
